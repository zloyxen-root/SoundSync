name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build APK (Debug)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK file
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/*.apk release_apk/SoundSync.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundSync-debug
          path: release_apk/SoundSync.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "SoundSync Latest Build"
          body: "🚀 Автоматическая сборка приложения SoundSync. Скачайте **SoundSync.apk** ниже и установите на телефон."
          draft: false
          prerelease: false
          files: release_apk/SoundSync.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
